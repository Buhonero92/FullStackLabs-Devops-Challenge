name: CI Pipeline

on: 
  pull_request:
    branches:
      - devel
      - stage
      - prod
    types:
      - opened
      - synchronize
      
  push:
    branches:
      - devel
      - stage
      - prod

jobs:

  config:
    name: Configure environment
    runs-on: ubuntu-latest

    outputs:
      deployment_env: ${{ env.DEPLOYMENT_ENV || 'development'}}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Development env
        if: github.ref == 'refs/heads/devel'
        run: |
         echo "DEPLOYMENT_ENV=development" >> $GITHUB_ENV

      - name: Set Staging env
        if: github.ref == 'refs/heads/stage'
        run: |
         echo "DEPLOYMENT_ENV=staging" >> $GITHUB_ENV

      - name: Set Production env
        if: github.ref == 'refs/heads/prod'
        run: |
         echo "DEPLOYMENT_ENV=production" >> $GITHUB_ENV

  build:
    runs-on: ubuntu-latest
    needs: 
      - config
    steps: 
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run formatter
        run: npm run prettier

      - name: Run tests
        env: 
          CI: true
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ needs.config.outputs.deployment_env  }}
          path: ./build

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: 
      - config

    defaults:
      run:
        shell: bash

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Terraform workspace
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
         cd terraform
         terraform init --backend-config="env/${{ needs.config.outputs.deployment_env }}-backend.json"

      - name: Terraform plan
        run: |
         cd terraform
         terraform plan --var "env=${{ needs.config.outputs.deployment_env }}"  

  apply:
    name: Terraform apply
    if: |
     github.event_name == 'push' &&
     (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    needs: 
      - config
      - plan

    environment: ${{ github.ref == 'refs/heads/devel' && 'development' || github.ref == 'refs/heads/stage' && 'staging' || github.ref == 'refs/heads/prod' && 'production'}}

    defaults:
      run:
        shell: bash

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Terraform workspace
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          cd terraform
          terraform init --backend-config="env/${{ needs.config.outputs.deployment_env }}-backend.json"

      - name: Terraform apply
        run: |
          cd terraform
          terraform apply --auto-approve --var "env=${{ needs.config.outputs.deployment_env }}"  